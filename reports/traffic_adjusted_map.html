            return '';

        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }

            <td>${handleObject(layer.feature.properties[v])}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
