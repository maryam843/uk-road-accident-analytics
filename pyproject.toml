[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
